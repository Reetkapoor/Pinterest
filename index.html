<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest - Discover. Pin. Share.</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
</head>
<body>
    <span class="logo">
        <img src="logo.png" class="logo-pic">
    </span>
    <h1>Pinterest</h1>
    <form id="search-form">
        <input type="text" id="search-box" placeholder="Discover. Pin. Share.">
        <button><img src="search-icon.png" ></button>
    </form>
    <div id="search-result">
        <button id="show-more-btn">Tap to see more !</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
